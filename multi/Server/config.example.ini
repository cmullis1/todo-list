; Copy this file to config.ini and change the values before you run the server.

[DEFAULT]
; A long random string used to sign sessions. Never share the real one.
SECRET_KEY = change-me-to-a-long-random-string
DATABASE_URL = sqlite:///app_database.db

[CORS]
; Comma-separated list of origins allowed to call the API from a browser.
origins = http://localhost:3000

[SETTINGS]
ACCESS_TOKEN_EXPIRATION_DAYS = 7
RATE_LIMIT_DEFAULT = 6000 per day;120 per hour
RATE_LIMIT_LOGIN = 50 per minute
